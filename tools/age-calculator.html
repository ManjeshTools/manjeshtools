<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f4f8f5;color:#173d2b;font-family:Arial,sans-serif}
main{max-width:600px;margin:30px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{color:#176b3a}
label{display:block;margin-top:18px;font-weight:bold}
input,button{width:100%;padding:13px;margin:10px 0;border-radius:8px}
input{border:1px solid #ccc}
button{background:#176b3a;color:white;border:0;font-size:16px;font-weight:bold;cursor:pointer}
#result{margin-top:20px;padding:15px;background:#f4f8f5;border-radius:8px;line-height:1.8}
a{color:#176b3a}
</style>
</head>
<body>
<main>
<a href="../index.html">← Back to MANJESH Tools</a>

<h1>Free Online Age Calculator</h1>
<p>Enter your date of birth to calculate your age in years, months, and days.</p>

<label for="dob">Date of Birth</label>
<input id="dob" type="date">
<button id="calculate" type="button">Calculate Age</button>

<div id="result" aria-live="polite">Your age will appear here.</div>
</main>

<script>
const dobInput=document.getElementById("dob");
const result=document.getElementById("result");

dobInput.max=new Date().toLocaleDateString("en-CA");

document.getElementById("calculate").addEventListener("click",()=>{
    const value=dobInput.value;

    if(!value){
        result.textContent="Please select your date of birth.";
        return;
    }

    const [year,month,day]=value.split("-").map(Number);
    const dob=new Date(year,month-1,day);
    const today=new Date();

    today.setHours(0,0,0,0);

    if(dob>today){
        result.textContent="Date of birth cannot be in the future.";
        return;
    }

    let years=today.getFullYear()-dob.getFullYear();
    let months=today.getMonth()-(dob.getMonth());
    let days=today.getDate()-dob.getDate();

    if(days<0){
        months--;
        const lastMonthDays=new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        ).getDate();
        days+=lastMonthDays;
    }

    if(months<0){
        years--;
        months+=12;
    }

    result.innerHTML="<strong>Your Age:</strong><br>"+
        years+" years, "+months+" months, "+days+" days";
});
</script>
</body>
