
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator - MANJESH Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f4f8f5;color:#173d2b;font-family:Arial,sans-serif}
main{max-width:600px;margin:30px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{color:#176b3a}
label{display:block;margin-top:18px;font-weight:bold}
input,button{width:100%;padding:13px;margin:10px 0;border-radius:8px}
input{border:1px solid #ccc}
button{background:#176b3a;color:white;border:0;font-size:16px;font-weight:bold}
#result{margin-top:20px;padding:15px;background:#f4f8f5;border-radius:8px;line-height:1.8}
a{color:#176b3a}
</style>
</head>
<body>
<main>
<a href="../index.html">← Back to MANJESH Tools</a>
<h1>Age Calculator</h1>
<p>Enter your date of birth to calculate your age.</p>
<label for="dob">Date of Birth</label>
<input id="dob" type="date">
<button id="calculate">Calculate Age</button>
<div id="result" aria-live="polite">Your age will appear here.</div>
</main>
<script>
document.getElementById("calculate").addEventListener("click",()=>{
const value=document.getElementById("dob").value;
const result=document.getElementById("result");
if(!value){result.textContent="Please select your date of birth.";return;}
const dob=new Date(value+"T00:00:00");
const today=new Date();
if(dob>today){result.textContent="Date of birth cannot be in the future.";return;}
let years=today.getFullYear()-dob.getFullYear();
let months=today.getMonth()-dob.getMonth();
let days=today.getDate()-dob.getDate();
if(days<0){
months--;
const lastMonthDays=new Date(today.getFullYear(),today.getMonth(),0).getDate();
days+=lastMonthDays;
}
if(months<0){years--;months+=12;}
result.innerHTML="<strong>Your Age:</strong><br>"+years+" years, "+months+" months, "+days+" days";
});
</script>
</body>
</html>
