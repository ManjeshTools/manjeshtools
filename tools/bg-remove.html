
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BG Remove - MANJESH Tools</title>
  <meta name="description" content="Remove photo backgrounds free with MANJESH Tools.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f3f7f4; color: #183b2b;
    }
    header {
      background: #146b3a; color: white;
      padding: 18px 12px; text-align: center;
    }
    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 6px 0 0; font-size: 14px; }
    main {
      max-width: 620px; margin: 24px auto; padding: 20px;
      background: white; border-radius: 16px;
      box-shadow: 0 4px 20px #00000010;
    }
    h2 { text-align: center; margin-top: 0; }
    .hint { color: #52665a; text-align: center; line-height: 1.5; }
    input[type=file] {
      display: block; width: 100%; margin: 20px 0;
      padding: 12px; border: 1px solid #cbd8ce; border-radius: 9px;
    }
    button, .download {
      display: block; width: 100%; padding: 14px;
      border: 0; border-radius: 9px; text-align: center;
      font-size: 16px; font-weight: bold; cursor: pointer;
      text-decoration: none;
    }
    button { background: #146b3a; color: white; }
    button:disabled { opacity: .55; cursor: wait; }
    .download { background: #f28c28; color: #fff; margin-top: 12px; }
    .preview {
      margin-top: 20px; padding: 12px; border: 1px solid #dce6de;
      border-radius: 12px; text-align: center;
    }
    .preview img {
      display: block; max-width: 100%; max-height: 360px;
      object-fit: contain; margin: 10px auto;
    }
    .hidden { display: none !important; }
    #status {
      margin: 16px 0; padding: 12px; border-radius: 8px;
      background: #eef5ef; line-height: 1.5; overflow-wrap: anywhere;
    }
    progress { width: 100%; height: 18px; }
    footer { text-align: center; padding: 16px; color: #617267; }
  </style>
</head>
<body>
  <header>
    <h1>MANJESH Tools</h1>
    <p>Free Online Background Remover</p>
  </header>

  <main>
    <h2>AI Background Remover</h2>
    <p class="hint">फोटो चुनें और Submit दबाएँ। प्रोसेसिंग आपके ब्राउज़र में होगी।</p>

    <input id="photo" type="file" accept="image/*">

    <div id="originalBox" class="preview hidden">
      <strong>आपकी फोटो</strong>
      <img id="original" alt="Uploaded photo preview">
    </div>

    <button id="submitBtn" type="button">Submit — Remove Background</button>

    <div id="status" role="status" aria-live="polite">
      पहले एक फोटो चुनें।
    </div>

    <progress id="progress" class="hidden" max="100" value="0"></progress>

    <div id="resultBox" class="preview hidden">
      <strong>बैकग्राउंड हट गया!</strong>
      <p class="hint">चेकबोर्ड जैसा बैकग्राउंड पारदर्शिता दिखाता है।</p>
      <img id="result" alt="Photo with background removed">
      <a id="downloadBtn" class="download" download="manjesh-bg-removed.png">
        Download PNG
      </a>
    </div>
  </main>

  <footer>© MANJESH Tools</footer>

  <script type="module">
    const photoInput = document.getElementById('photo');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('status');
    const progress = document.getElementById('progress');
    const originalBox = document.getElementById('originalBox');
    const originalImg = document.getElementById('original');
    const resultBox = document.getElementById('resultBox');
    const resultImg = document.getElementById('result');
    const downloadBtn = document.getElementById('downloadBtn');

    let selectedFile = null;
    let originalURL = null;
    let resultURL = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    photoInput.addEventListener('change', () => {
      selectedFile = photoInput.files?.[0] || null;
      resultBox.classList.add('hidden');

      if (originalURL) URL.revokeObjectURL(originalURL);
      if (resultURL) URL.revokeObjectURL(resultURL);
      originalURL = null;
      resultURL = null;

      if (!selectedFile) {
        originalBox.classList.add('hidden');
        setStatus('पहले एक फोटो चुनें।');
        return;
      }

      if (!selectedFile.type.startsWith('image/')) {
        selectedFile = null;
        photoInput.value = '';
        originalBox.classList.add('hidden');
        setStatus('कृपया JPG, PNG या दूसरी मान्य फोटो चुनें।');
        return;
      }

      originalURL = URL.createObjectURL(selectedFile);
      originalImg.src = originalURL;
      originalBox.classList.remove('hidden');
      setStatus('फोटो तैयार है। अब Submit दबाएँ।');
    });

    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        setStatus('पहले फोटो अपलोड करें।');
        return;
      }

      submitBtn.disabled = true;
      photoInput.disabled = true;
      resultBox.classList.add('hidden');
      progress.classList.remove('hidden');
      progress.value = 5;
      setStatus('AI लाइब्रेरी लोड हो रही है। पहली बार थोड़ा समय लग सकता है…');

      try {
        // Load the browser-based AI library only after Submit.
        const module = await import(
          'https://esm.sh/@imgly/background-removal@1.5.5'
        );

        const removeBackground =
          module.default || module.removeBackground;

        if (typeof removeBackground !== 'function') {
          throw new Error('AI लाइब्रेरी सही तरीके से लोड नहीं हुई।');
        }

        progress.value = 20;
        setStatus('AI मॉडल डाउनलोड/तैयार हो रहा है। पेज खुला रखें…');

        const outputBlob = await removeBackground(selectedFile, {
          model: 'small',
          output: { format: 'image/png', quality: 0.9 },
          progress: (key, current, total) => {
            if (total > 0) {
              const percent = Math.round((current / total) * 100);
              progress.value = Math.max(20, Math.min(90, percent));
              setStatus('AI संसाधन लोड हो रहे हैं: ' + percent + '%');
            }
          }
        });

        if (!(outputBlob instanceof Blob) || outputBlob.size === 0) {
          throw new Error('AI से खाली परिणाम मिला।');
        }

        if (resultURL) URL.revokeObjectURL(resultURL);
        resultURL = URL.createObjectURL(outputBlob);
        resultImg.src = resultURL;
        downloadBtn.href = resultURL;
        resultBox.classList.remove('hidden');
        progress.value = 100;
        setStatus('काम पूरा! अब Download PNG दबाएँ।');
      } catch (error) {
        console.error('BG Remove error:', error);
        let message = error?.message || String(error);

        if (!navigator.onLine) {
          message = 'इंटरनेट कनेक्शन बंद है। इंटरनेट चालू करके फिर प्रयास करें।';
        } else if (/fetch|network|load failed|import/i.test(message)) {
          message = 'AI लाइब्रेरी या मॉडल डाउनलोड नहीं हो पाया। Chrome में इंटरनेट जाँचें और दोबारा प्रयास करें।';
        } else if (/memory|allocation|wasm|webgl/i.test(message)) {
          message = 'फोन की मेमोरी या ब्राउज़र में समस्या आई। छोटी फोटो चुनें और फिर प्रयास करें।';
        }

        setStatus('बैकग्राउंड नहीं हट पाया: ' + message);
        progress.value = 0;
      } finally {
        submitBtn.disabled = false;
        photoInput.disabled = false;
      }
    });
  </script>
</body>
</html>
