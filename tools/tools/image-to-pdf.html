
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Convert multiple images into a PDF online with MANJESH Tools.">
<title>Image to PDF Converter | MANJESH Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f8f7;color:#183c2b}
header{background:#fff;padding:16px 5%;border-bottom:1px solid #e3eae5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:21px;font-weight:800;color:#176b43}.brand span{color:#f28c28}
a{color:#176b43;text-decoration:none;font-weight:600}
main{max-width:760px;margin:40px auto;padding:0 16px}
.card{background:white;border:1px solid #e0e9e2;border-radius:18px;padding:25px;box-shadow:0 8px 30px #173d2b0b}
h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px}
p{color:#65776b;line-height:1.6}
label{display:block;font-weight:700;margin:20px 0 8px}
input,select,button{width:100%;padding:13px;border-radius:10px;font-size:16px}
input,select{border:1px solid #cbd8ce;background:white}
button{border:0;background:#176b43;color:white;font-weight:700;cursor:pointer;margin-top:16px}
button:disabled{opacity:.6}
#result{margin-top:18px;line-height:1.6;overflow-wrap:anywhere}
#files{line-height:1.8;color:#52675a}
footer{text-align:center;padding:25px;color:#65776b;font-size:14px}
</style>
</head>
<body>
<header>
<div class="brand">MANJESH <span>Tools</span></div>
<a href="../index.html">← All Tools</a>
</header>
<main>
<section class="card">
<h1>Image to PDF Converter</h1>
<p>Choose one or more images and combine them into a single PDF. Files are processed in your browser.</p>
<label for="images">Choose images</label>
<input id="images" type="file" accept="image/*" multiple>
<div id="files"></div>
<label for="pageSize">PDF page size</label>
<select id="pageSize">
<option value="a4">A4</option>
<option value="letter">Letter</option>
<option value="fit">Fit image to page</option>
</select>
<button id="convert">Convert to PDF</button>
<div id="result" aria-live="polite"></div>
<a id="download" style="display:none" download="manjesh-images.pdf">Download PDF</a>
</section>
</main>
<footer>© 2026 MANJESH Tools · Simple Tools. Better Productivity.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const input=document.getElementById('images');
const filesText=document.getElementById('files');
const result=document.getElementById('result');
const convert=document.getElementById('convert');
const download=document.getElementById('download');
input.addEventListener('change',()=>{
const files=Array.from(input.files||[]);
filesText.textContent=files.length?files.map((f,i)=>(i+1)+'. '+f.name).join('\n'):'';
result.textContent='';download.style.display='none';
});
function loadImage(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onerror=()=>reject(new Error('Could not read '+file.name));
reader.onload=()=>{
const img=new Image();
img.onload=()=>resolve(img);
img.onerror=()=>reject(new Error('Could not open '+file.name));
img.src=reader.result;
};
reader.readAsDataURL(file);
});
}
convert.addEventListener('click',async()=>{
const files=Array.from(input.files||[]);
if(!files.length){result.textContent='Please choose at least one image.';return}
if(!window.jspdf){result.textContent='PDF library could not load. Check your internet connection and reload this page.';return}
convert.disabled=true;result.textContent='Creating your PDF...';
try{
const {jsPDF}=window.jspdf;
const mode=document.getElementById('pageSize').value;
const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:mode==='letter'?'letter':'a4'});
for(let i=0;i<files.length;i++){
const img=await loadImage(files[i]);
let pw=210,ph=297;
if(mode==='letter'){pw=215.9;ph=279.4}
if(mode==='fit'){pw=img.naturalWidth*0.264583;ph=img.naturalHeight*0.264583}
if(i>0)pdf.addPage(mode==='fit'?[pw,ph]:(mode==='letter'?'letter':'a4'),'portrait');
const margin=mode==='fit'?0:8;
const availableW=pw-margin*2,availableH=ph-margin*2;
const scale=Math.min(availableW/img.naturalWidth,availableH/img.naturalHeight);
const w=img.naturalWidth*scale,h=img.naturalHeight*scale;
const x=(pw-w)/2,y=(ph-h)/2;
const canvas=document.createElement('canvas');
canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);
pdf.addImage(canvas.toDataURL('JPEG',0.92),'JPEG',x,y,w,h,undefined,'FAST');
}
const blob=pdf.output('blob');
const url=URL.createObjectURL(blob);
download.href=url;download.style.display='inline-block';
result.textContent='PDF created successfully! Pages: '+files.length+' · Size: '+(blob.size/1024).toFixed(1)+' KB';
}catch(e){result.textContent='Could not create PDF. Try smaller images or another file.'}
finally{convert.disabled=false}
});
</script>
</body>
</html>
