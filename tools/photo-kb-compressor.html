<script>
const photo = document.getElementById('photo');
const preview = document.getElementById('preview');
const target = document.getElementById('target');
const result = document.getElementById('result');
const compress = document.getElementById('compress');
const download = document.getElementById('download');

let selectedImage = null;
let previewUrl = null;

photo.addEventListener('change', () => {
  result.textContent = '';
  download.style.display = 'none';
  selectedImage = null;

  const file = photo.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    result.textContent = 'Please select a valid image.';
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const img = new Image();

    img.onload = () => {
      selectedImage = img;
      preview.src = reader.result;
      preview.style.display = 'block';
      result.textContent =
        'Original size: ' + (file.size / 1024).toFixed(1) + ' KB';
    };

    img.onerror = () => {
      result.textContent = 'Could not open this image.';
    };

    img.src = reader.result;
  };

  reader.onerror = () => {
    result.textContent = 'Could not read this image.';
  };

  reader.readAsDataURL(file);
});

compress.addEventListener('click', async () => {
  if (!selectedImage) {
    result.textContent = 'Please choose a photo first.';
    return;
  }

  const kb = Number(target.value);

  if (!Number.isFinite(kb) || kb < 5 || kb > 10000) {
    result.textContent = 'Enter a target between 5 and 10000 KB.';
    return;
  }

  compress.disabled = true;
  download.style.display = 'none';
  result.textContent = 'Finding the best image size...';

  try {
    const targetBytes = Math.floor(kb * 1024);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    if (!ctx) throw new Error('Canvas unavailable');

    let width = selectedImage.naturalWidth;
    let height = selectedImage.naturalHeight;
    let bestBlob = null;

    // Try original dimensions first, then reduce dimensions
    // only if the target cannot be reached by JPEG quality alone.
    for (let resize = 0; resize < 12; resize++) {
      canvas.width = Math.max(1, Math.round(width));
      canvas.height = Math.max(1, Math.round(height));

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(selectedImage, 0, 0, canvas.width, canvas.height);

      let low = 0.05;
      let high = 0.98;

      // Find the highest JPEG quality that stays within target.
      for (let i = 0; i < 12; i++) {
        const quality = (low + high) / 2;
        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, 'image/jpeg', quality)
        );

        if (!blob) throw new Error('Image encoding failed');

        if (blob.size <= targetBytes) {
          if (!bestBlob || blob.size > bestBlob.size) {
            bestBlob = blob;
          }
          low = quality;
        } else {
          high = quality;
        }
      }

      // Stop when we have a usable result reasonably close to target.
      if (bestBlob && bestBlob.size >= targetBytes * 0.95) {
        break;
      }

      // If quality alone cannot get close enough, try smaller dimensions.
      if (resize < 11) {
        width *= 0.85;
        height *= 0.85;
        bestBlob = null;
      }
    }

    if (!bestBlob) {
      result.textContent =
        'Could not create a file within the target size. Try a larger target.';
      return;
    }

    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(bestBlob);

    download.href = previewUrl;
    download.download = 'manjesh-tools-compressed.jpg';
    download.style.display = 'block';

    const actualKB = bestBlob.size / 1024;
    const percentage = (actualKB / kb) * 100;

    result.textContent =
      'Target: ' + kb + ' KB | Result: ' + actualKB.toFixed(1) +
      ' KB' +
      (actualKB <= kb
        ? (percentage >= 95
            ? ' — Target reached closely.'
            : ' — Under target; best result found without exceeding it.')
        : ' — Target exceeded. Please try again.');

  } catch (error) {
    result.textContent =
      'Compression failed. Please try another image.';
  } finally {
    compress.disabled = false;
  }
});
</script>
