
<script>
document.addEventListener('DOMContentLoaded', () => {
  const photo = document.getElementById('photo');
  const preview = document.getElementById('preview');
  const target = document.getElementById('target');
  const result = document.getElementById('result');
  const compress = document.getElementById('compress');
  const download = document.getElementById('download');

  // Check that the original page's elements exist.
  if (!photo || !preview || !target || !result || !compress || !download) {
    console.error('Photo compressor: required HTML element ID is missing.');
    return;
  }

  let selectedImage = null;
  let previewUrl = null;

  // Optional KB/MB selector. If it is not present, KB is used.
  const unit = document.getElementById('unit');

  function getTargetKB() {
    const value = Number(target.value);
    if (!Number.isFinite(value) || value <= 0) return NaN;
    return unit && unit.value === 'MB' ? value * 1024 : value;
  }

  photo.addEventListener('change', () => {
    result.textContent = '';
    download.style.display = 'none';
    selectedImage = null;

    const file = photo.files && photo.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      result.textContent = 'Please select a valid image.';
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      const img = new Image();

      img.onload = () => {
        selectedImage = img;
        preview.src = reader.result;
        preview.style.display = 'block';
        result.textContent =
          'Original size: ' + (file.size / 1024).toFixed(1) + ' KB';
      };

      img.onerror = () => {
        result.textContent = 'Could not open this image.';
      };

      img.src = reader.result;
    };

    reader.onerror = () => {
      result.textContent = 'Could not read this image.';
    };

    reader.readAsDataURL(file);
  });

  compress.addEventListener('click', async (event) => {
    event.preventDefault();

    if (!selectedImage) {
      result.textContent = 'Please choose a photo first.';
      return;
    }

    const kb = getTargetKB();

    if (!Number.isFinite(kb) || kb < 5 || kb > 10240) {
      result.textContent =
        'Enter a target between 5 KB and 10 MB.';
      return;
    }

    compress.disabled = true;
    download.style.display = 'none';
    result.textContent = 'Finding the best image size...';

    try {
      const targetBytes = Math.floor(kb * 1024);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      if (!ctx) throw new Error('Canvas unavailable');

      let width = selectedImage.naturalWidth;
      let height = selectedImage.naturalHeight;
      let bestBlob = null;

      // Keep the best result across all resize attempts.
      for (let resize = 0; resize < 12; resize++) {
        canvas.width = Math.max(1, Math.round(width));
        canvas.height = Math.max(1, Math.round(height));
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(selectedImage, 0, 0, canvas.width, canvas.height);

        let low = 0.05;
        let high = 0.98;

        // Search for the largest output that does not exceed the target.
        for (let i = 0; i < 16; i++) {
          const quality = (low + high) / 2;
          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(
              b => b ? resolve(b) : reject(new Error('Encoding failed')),
              'image/jpeg',
              quality
            );
          });

          if (blob.size <= targetBytes) {
            if (!bestBlob || blob.size > bestBlob.size) {
              bestBlob = blob;
            }
            low = quality;
          } else {
            high = quality;
          }
        }

        // Stop if output is at least 98% of the target.
        if (bestBlob && bestBlob.size >= targetBytes * 0.98) {
          break;
        }

        // Reduce dimensions only if quality adjustment was insufficient.
        // Do not discard the best result already found.
        width *= 0.90;
        height *= 0.90;
      }

      if (!bestBlob) {
        result.textContent =
          'Could not create the image. Please try a larger target.';
        return;
      }

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(bestBlob);

      download.href = previewUrl;
      download.download = 'manjesh-tools-compressed.jpg';
      download.style.display = 'block';

      const actualKB = bestBlob.size / 1024;
      const percentage = (bestBlob.size / targetBytes) * 100;

      result.textContent =
        'Target: ' + kb.toFixed(1) + ' KB | Result: ' +
        actualKB.toFixed(1) + ' KB' +
        (bestBlob.size <= targetBytes
          ? (percentage >= 98
              ? ' — Target reached closely.'
              : ' — Best result found without exceeding the target.')
          : ' — Please try again.');

    } catch (error) {
      console.error('Photo compression error:', error);
      result.textContent =
        'Compression failed. Please try another image.';
    } finally {
      compress.disabled = false;
    }
  });

  // Prevent memory leaks when the page is closed.
  window.addEventListener('pagehide', () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
  });
});
</script>
