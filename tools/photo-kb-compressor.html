
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo KB Compressor Online Free | MANJESH Tools</title>
  <meta name="description" content="Compress photos to your desired KB size online for free with MANJESH Tools. Choose a target size, compress your image in your browser, and download it.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://manjeshtools.github.io/manjeshtools/tools/photo-kb-compressor.html">
  <meta property="og:title" content="Photo KB Compressor Online Free | MANJESH Tools">
  <meta property="og:description" content="Compress your photo to a smaller KB size for free. Fast, simple, browser-based image compression.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://manjeshtools.github.io/manjeshtools/tools/photo-kb-compressor.html">
  <meta name="theme-color" content="#176b43">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8f7;
      color: #183c2b;
    }
    header {
      background: white;
      padding: 16px 5%;
      border-bottom: 1px solid #e3eae5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand { font-size: 21px; font-weight: 800; color: #176b43; }
    .brand span { color: #f28c28; }
    a { color: #176b43; text-decoration: none; font-weight: 600; }
    main { max-width: 760px; margin: 40px auto; padding: 0 16px; }
    .card {
      background: white;
      border: 1px solid #e0e9e2;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px #173d2b0b;
    }
    h1 { font-size: clamp(27px, 5vw, 38px); margin: 0 0 12px; }
    .muted { color: #65776b; line-height: 1.6; }
    label { display: block; font-weight: 700; margin: 20px 0 8px; }
    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd8ce; background: white; }
    button {
      border: 0;
      background: #176b43;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .secondary { background: #f28c28; color: #1f2d24; }
    #preview {
      display: none;
      max-width: 100%;
      max-height: 300px;
      margin: 18px auto;
    }
    .result { margin-top: 18px; overflow-wrap: anywhere; }
    footer { text-align: center; padding: 25px; color: #65776b; font-size: 14px; }
  </style>
</head>

<body>
  <header>
    <div class="brand">MANJESH <span>Tools</span></div>
    <a href="../index.html">← All Tools</a>
  </header>

  <main>
    <section class="card">
      <h1>Free Online Photo KB Compressor</h1>
      <p class="muted">Compress your photo to a target KB size and download a smaller image. Your photo is processed on your device and is not uploaded to our server.</p>

      <label for="photo">Choose a photo</label>
      <input id="photo" type="file" accept="image/*">

      <img id="preview" alt="Preview of the selected photo">

      <label for="target">Target size (KB)</label>
      <input id="target" type="number" min="5" max="10000" value="100">

      <button id="compress" type="button">Compress Photo</button>
      <div id="result" class="result" aria-live="polite"></div>

      <a id="download" style="display:none" download="compressed-photo.jpg">
        <button class="secondary" type="button">Download Compressed Photo</button>
      </a>
    </section>
  </main>

  <footer>© 2026 MANJESH Tools · Simple Tools. Better Productivity.</footer>

  <script>
    (() => {
      const photo = document.getElementById('photo');
      const preview = document.getElementById('preview');
      const target = document.getElementById('target');
      const result = document.getElementById('result');
      const compress = document.getElementById('compress');
      const download = document.getElementById('download');

      let selectedImage = null;
      let previewUrl = null;

      photo.addEventListener('change', () => {
        result.textContent = '';
        download.style.display = 'none';
        selectedImage = null;

        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }

        const file = photo.files && photo.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          result.textContent = 'Please select a valid image.';
          return;
        }

        const reader = new FileReader();

        reader.onload = () => {
          const img = new Image();

          img.onload = () => {
            selectedImage = img;
            preview.src = reader.result;
            preview.style.display = 'block';
            result.textContent =
              'Original size: ' + (file.size / 1024).toFixed(1) + ' KB';
          };

          img.onerror = () => {
            result.textContent = 'Could not open this image.';
          };

          img.src = reader.result;
        };

        reader.onerror = () => {
          result.textContent = 'Could not read this image.';
        };

        reader.readAsDataURL(file);
      });

      compress.addEventListener('click', async () => {
        if (!selectedImage) {
          result.textContent = 'Please choose a photo first.';
          return;
        }

        const kb = Number(target.value);

        if (!Number.isFinite(kb) || kb < 5 || kb > 10000) {
          result.textContent = 'Enter a target between 5 and 10000 KB.';
          return;
        }

        compress.disabled = true;
        download.style.display = 'none';
        result.textContent = 'Finding the closest image size...';

        try {
          const targetBytes = Math.floor(kb * 1024);
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          if (!ctx) throw new Error('Canvas is unavailable.');

          let width = selectedImage.naturalWidth;
          let height = selectedImage.naturalHeight;
          let bestBlob = null;

          for (let resize = 0; resize < 24; resize++) {
            canvas.width = Math.max(1, Math.round(width));
            canvas.height = Math.max(1, Math.round(height));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(selectedImage, 0, 0, canvas.width, canvas.height);

            let low = 0.01;
            let high = 1;

            for (let i = 0; i < 20; i++) {
              const quality = (low + high) / 2;

              const blob = await new Promise((resolve, reject) => {
                canvas.toBlob(
                  output => output
                    ? resolve(output)
                    : reject(new Error('Image encoding failed.')),
                  'image/jpeg',
                  quality
                );
              });

              if (blob.size <= targetBytes) {
                if (!bestBlob || blob.size > bestBlob.size) {
                  bestBlob = blob;
                }
                low = quality;
              } else {
                high = quality;
              }
            }

            if (bestBlob && bestBlob.size >= targetBytes * 0.99) {
              break;
            }

            width *= 0.92;
            height *= 0.92;
          }

          if (!bestBlob) {
            result.textContent =
              'Could not create a file within this target. Try a larger target.';
            return;
          }

          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(bestBlob);

          download.href = previewUrl;
          download.download = 'manjesh-tools-compressed.jpg';
          download.style.display = 'block';

          const actualKB = bestBlob.size / 1024;
          const percentage = (bestBlob.size / targetBytes) * 100;

          result.textContent =
            'Target: ' + kb + ' KB | Result: ' + actualKB.toFixed(1) +
            ' KB' +
            (bestBlob.size <= targetBytes
              ? (percentage >= 98
                  ? ' — Target reached closely.'
                  : ' — Best available result without exceeding the target.')
              : ' — Please try again.');

        } catch (error) {
          console.error('Compression error:', error);
          result.textContent =
            'Compression failed. Please try another image.';
        } finally {
          compress.disabled = false;
        }
      });

      window.addEventListener('pagehide', () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
      });
    })();
  </script>
</body>
</html>
