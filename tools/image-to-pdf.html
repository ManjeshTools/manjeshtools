
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF - MANJESH Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#173d2b;padding:20px}
main{max-width:600px;margin:30px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{color:#176b3a}
p{line-height:1.6}
input,button{width:100%;padding:13px;margin:10px 0;border-radius:8px}
input{border:1px solid #ccc}
button{background:#176b3a;color:white;border:0;font-weight:bold;font-size:16px}
a{color:#176b3a}
</style>
</head>
<body>
<main>
<a href="../index.html">← Back to MANJESH Tools</a>
<h1>Image to PDF</h1>
<p>Select your images and convert them into a PDF file.</p>
<input id="images" type="file" accept="image/*" multiple>
<button id="convert">Convert Images to PDF</button>
<p id="status">Choose one or more images to begin.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
document.getElementById("convert").addEventListener("click",async()=>{
const files=document.getElementById("images").files;
const status=document.getElementById("status");
if(!files.length){status.textContent="Please select at least one image.";return;}
if(!window.jspdf){status.textContent="PDF library failed to load. Check your internet connection.";return;}
status.textContent="Creating PDF...";
try{
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
for(let i=0;i<files.length;i++){
const data=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(files[i]);
});
const img=await new Promise((resolve,reject)=>{
const image=new Image();
image.onload=()=>resolve(image);
image.onerror=reject;
image.src=data;
});
const width=pdf.internal.pageSize.getWidth()-20;
const height=pdf.internal.pageSize.getHeight()-20;
const ratio=Math.min(width/img.width,height/img.height);
const w=img.width*ratio,h=img.height*ratio;
if(i>0)pdf.addPage();
pdf.addImage(data,"JPEG",10,10,w,h);
}
pdf.save("manjesh-images.pdf");
status.textContent="PDF downloaded successfully!";
}catch(e){status.textContent="Could not create PDF. Please try another image.";}
});
</script>
</body>
</html>
