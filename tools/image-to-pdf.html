
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Image to PDF Converter Online | MANJESH Tools</title>
<meta name="description" content="Convert images to PDF online for free with MANJESH Tools. Select multiple images, combine them into one PDF, and download your file in seconds.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://manjeshtools.github.io/manjeshtools/tools/image-to-pdf.html">

<meta property="og:title" content="Free Image to PDF Converter | MANJESH Tools">
<meta property="og:description" content="Turn multiple images into one PDF file for free with this simple online image to PDF converter.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://manjeshtools.github.io/manjeshtools/tools/image-to-pdf.html">
<meta name="theme-color" content="#176b3a">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#173d2b;padding:20px}
main{max-width:600px;margin:30px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{color:#176b3a}
p{line-height:1.6}
input,button{width:100%;padding:13px;margin:10px 0;border-radius:8px}
input{border:1px solid #ccc}
button{background:#176b3a;color:white;border:0;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
a{color:#176b3a}
</style>
</head>
<body>
<main>
<a href="../index.html">← Back to MANJESH Tools</a>
<h1>Free Image to PDF Converter</h1>
<p>Convert multiple images into a single PDF file online for free. Select your images and download the PDF. Image processing happens in your browser.</p>

<label for="images">Choose images</label>
<input id="images" type="file" accept="image/*" multiple>
<button id="convert" type="button">Convert Images to PDF</button>
<p id="status" aria-live="polite">Choose one or more images to begin.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const convertButton=document.getElementById("convert");

convertButton.addEventListener("click",async()=>{
const files=document.getElementById("images").files;
const status=document.getElementById("status");

if(!files.length){
status.textContent="Please select at least one image.";
return;
}

if(!window.jspdf){
status.textContent="PDF library failed to load. Check your internet connection.";
return;
}

status.textContent="Creating PDF...";
convertButton.disabled=true;

try{
const {jsPDF}=window.jspdf;
let pdf=null;

for(let i=0;i<files.length;i++){
if(!files[i].type.startsWith("image/")){
throw new Error("Please select only image files.");
}

const data=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(files[i]);
});

const img=await new Promise((resolve,reject)=>{
const image=new Image();
image.onload=()=>resolve(image);
image.onerror=reject;
image.src=data;
});

if(!pdf){
pdf=new jsPDF();
}else{
pdf.addPage();
}

const pageWidth=pdf.internal.pageSize.getWidth()-20;
const pageHeight=pdf.internal.pageSize.getHeight()-20;
const ratio=Math.min(pageWidth/img.width,pageHeight/img.height);
const w=img.width*ratio;
const h=img.height*ratio;
const x=(pdf.internal.pageSize.getWidth()-w)/2;
const y=(pdf.internal.pageSize.getHeight()-h)/2;

const format=data.startsWith("data:image/png")?"PNG":
data.startsWith("data:image/webp")?"WEBP":"JPEG";

pdf.addImage(data,format,x,y,w,h);
}

pdf.save("manjesh-images.pdf");
status.textContent="PDF downloaded successfully!";
}catch(error){
status.textContent=error.message==="Please select only image files."
?error.message
:"Could not create PDF. Please try another image.";
}finally{
convertButton.disabled=false;
}
});
</script>
</body>
</html>
